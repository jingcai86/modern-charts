<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="Explore modern-charts, a framework-agnostic charting library with interactive web components, examples, and guides." />
    <meta name="color-scheme" content="light dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <script>
      try {
        var saved = localStorage.getItem('modern-charts-theme-mode');
        var meta = document.querySelector('meta[name="color-scheme"]');
        if (saved === 'light' || saved === 'dark') {
          if (meta) meta.content = saved;
          document.documentElement.dataset.theme = saved;
        } else {
          if (meta) meta.content = 'light dark';
          document.documentElement.dataset.theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
      } catch (e) {}
    </script>
    <title>modern-charts v0.2.0 — Composable Web Component Charts</title>
    <style>
      @import "./styles/index.css";
    </style>
  </head>
  <body>
    <header class="site-header">
      <div class="header-left">
        <a href="#/" class="brand-link" id="brand-home-link">
          <div class="brand-group">
            <h1 class="brand-title">modern-charts</h1>
            <span class="version-pill">v0.2.0</span>
          </div>
          <p class="brand-subtitle">
            Composable Web Component Charting Library powered by D3 &amp; Pretext · Agentic AI Ready
          </p>
        </a>
      </div>

      <div class="global-controls">
        <nav class="site-nav" aria-label="Primary">
          <button
            type="button"
            id="nav-pages-trigger"
            class="nav-dropdown-trigger"
            popovertarget="studio-pages-menu"
            popovertargetaction="toggle"
            aria-controls="studio-pages-menu"
            aria-expanded="false"
          >
            <span id="nav-pages-current-label">⊞ All Charts</span>
            <span class="nav-dropdown-chevron" aria-hidden="true">▾</span>
          </button>

          <ul id="studio-pages-menu" class="nav-dropdown-panel" popover="auto">
            <li>
              <a
                href="#/"
                class="nav-dropdown-link"
                data-nav-route="overview"
                data-nav-label="⊞ All Charts"
              >
                ⊞ All Charts
              </a>
            </li>
            <li id="studio-pages-resources">
              <details class="nav-dropdown-group">
                <summary id="nav-resources-label" class="nav-dropdown-group-label">Resources</summary>
                <ul class="nav-dropdown-group-links" aria-labelledby="nav-resources-label">
                  <li>
                    <a
                      href="./llms.txt"
                      target="_blank"
                      rel="noopener noreferrer"
                      class="nav-dropdown-link"
                      title="Open AI Context (llms.txt)"
                    >
                      🤖 AI Context (llms.txt) ↗
                    </a>
                  </li>
                </ul>
              </details>
            </li>
          </ul>
        </nav>

        <div class="control-group">
          <label for="global-palette-select">Theme:</label>
          <select id="global-palette-select" name="palette" class="studio-select">
            <option value="shadcn" selected>Shadcn</option>
            <option value="material">Material</option>
            <option value="bootstrap">Bootstrap</option>
            <option value="antd">Ant Design</option>
            <option value="neutral">Neutral (generated)</option>
          </select>
        </div>
        <div class="control-group">
          <label for="global-appearance-select">Appearance:</label>
          <select id="global-appearance-select" name="appearance" class="studio-select">
            <option value="system" selected>System</option>
            <option value="dark">Dark</option>
            <option value="light">Light</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Dynamic Router View: Overview Gallery (#/), Chart Playground (#/chart/:id), or Guides (#/guide/:id) -->
    <main class="main-content" id="app-root"></main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
