<svg xmlns="http://www.w3.org/2000/svg" width="640" height="470" viewBox="0 0 640 470" role="img" aria-labelledby="title desc">
  <title id="title">Resize decision flow for autoSize and ResizeObserver</title>
  <desc id="desc">First render or explicit redraw runs the layout calculation immediately. On a container resize, if autoSize is on and ResizeObserver is available, the chart measures the resolved size and runs the layout calculation when width or height changes; otherwise the browser scales the previous viewBox into the new CSS box.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #17243b; }
    .heading { font-size: 26px; font-weight: 750; }
    .label { font-size: 21px; font-weight: 680; }
    .body { font-size: 19px; }
    .small { font-size: 17px; }
    .muted { fill: #485b75; }
    .center { text-anchor: middle; }
    .event { fill: #edf1ff; stroke: #99abd8; stroke-width: 1.8; }
    .resize { fill: #eaf7f0; stroke: #83b9a0; stroke-width: 1.8; }
    .keep { fill: #fff1e2; stroke: #d3a47b; stroke-width: 1.8; }
    .edge { fill: none; stroke: #52688d; stroke-width: 2.5; marker-end: url(#arrow); }
    .edge-text { fill: #354e6f; font-size: 18px; font-weight: 650; }
  </style>
  <rect width="640" height="470" rx="20" fill="#f5f7ff"/>
  <defs>
    <marker id="arrow" viewBox="0 0 12 12" refX="10" refY="6" markerWidth="5" markerHeight="5" orient="auto-start-reverse">
      <path d="M1 1l10 5-10 5z" fill="#52688d"/>
    </marker>
  </defs>
  <text x="28" y="42" class="heading">1. When does a layout calculation run?</text>

  <rect x="24" y="66" width="276" height="72" rx="13" class="event"/>
  <rect x="324" y="66" width="292" height="72" rx="13" class="event"/>
  <text x="162" y="96" class="label center">First render or</text>
  <text x="162" y="122" class="body center">explicit redraw</text>
  <text x="470" y="109" class="label center">Container resizes</text>

  <path class="edge" d="M62 138v272h250"/>
  <path class="edge" d="M470 138v30"/>
  <rect x="324" y="172" width="292" height="78" rx="13" class="resize"/>
  <text x="470" y="204" class="label center">autoSize on and</text>
  <text x="470" y="231" class="body center">ResizeObserver available?</text>

  <path class="edge" d="M324 211H207v58"/>
  <text x="254" y="201" class="edge-text">No</text>
  <path class="edge" d="M470 250v34"/>
  <text x="484" y="274" class="edge-text">Yes</text>

  <rect x="98" y="274" width="220" height="104" rx="13" class="keep"/>
  <text x="208" y="308" class="body center">Browser fits the</text>
  <text x="208" y="335" class="body center">previous viewBox</text>
  <text x="208" y="359" class="small center muted">into the new CSS box</text>

  <rect x="365" y="288" width="251" height="96" rx="13" class="resize"/>
  <text x="490" y="318" class="body center">Measure resolved size.</text>
  <text x="490" y="346" class="body center">Width or height</text>
  <text x="490" y="370" class="body center">changed?</text>
  <path class="edge" d="M365 335h-42"/>
  <text x="344" y="325" class="edge-text center">No</text>
  <path class="edge" d="M490 384v26"/>
  <text x="504" y="403" class="edge-text">Yes</text>

  <rect x="318" y="414" width="298" height="40" rx="10" class="resize"/>
  <text x="467" y="440" class="label center">Run 8-step layout pipeline →</text>
</svg>
