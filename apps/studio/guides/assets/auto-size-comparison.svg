<svg xmlns="http://www.w3.org/2000/svg" width="640" height="1030" viewBox="0 0 640 1030" role="img" aria-labelledby="title desc">
  <title id="title">The same chart before and after a container resize</title>
  <desc id="desc">Both charts start with a 600 by 320 CSS box and viewBox. The resized CSS box is 360 by 320. With autoSize enabled, the viewBox changes to 360 by 320 and the bars are recomputed. With autoSize disabled, the 600 by 320 viewBox stays fixed. The browser scales its content to 360 by 192 and centers it, leaving 64 pixels above and below.</desc>
  <style>
    text { font-family: system-ui, -apple-system, sans-serif; fill: #17243b; }
    .heading { font-size: 32px; font-weight: 750; }
    .label { font-size: 24px; font-weight: 680; }
    .body { font-size: 22px; }
    .small { font-size: 20px; }
    .muted { fill: #485b75; }
    .center { text-anchor: middle; }
    .box { fill: #eef1ff; stroke: #586bbe; stroke-width: 2.5; }
    .plot { fill: #fff; stroke: #96a9d0; stroke-width: 2; stroke-dasharray: 5 5; }
    .axis { fill: none; stroke: #465877; stroke-width: 2.5; }
    .tick { font-size: 26px; fill: #354962; }
    .bar { fill: #245e95; }
    .on { fill: #e9f8f1; stroke: #a8d0bd; stroke-width: 1.5; }
    .off { fill: #fff2e4; stroke: #dbbe9d; stroke-width: 1.5; }
    .yes { fill: #155f49; }
    .no { fill: #874922; }
    .arrow { fill: none; stroke: #64769a; stroke-width: 2.5; }
  </style>
  <rect width="640" height="1030" rx="24" fill="#f5f7ff"/>
  <text x="32" y="52" class="heading">One chart, one resize</text>
  <text x="32" y="87" class="body muted">600 × 320 px → 360 × 320 px</text>

  <text x="320" y="139" class="label center">Before resizing · both modes</text>
  <g transform="translate(95 163) scale(.75)">
    <rect class="box" width="600" height="320"/>
    <rect class="plot" x="50" y="24" width="520" height="240"/>
    <path class="axis" d="M50 24V264H570"/>
    <rect class="bar" x="76" y="144" width="208" height="120"/>
    <rect class="bar" x="336" y="84" width="208" height="180"/>
    <g class="tick" text-anchor="end">
      <text x="43" y="34">100</text>
      <text x="43" y="154">50</text>
      <text x="43" y="274">0</text>
    </g>
    <g class="tick center">
      <text x="180" y="299">Q1</text>
      <text x="440" y="299">Q2</text>
    </g>
  </g>
  <text x="320" y="438" class="body center">viewBox 600 × 320 · Plot 520 × 240</text>
  <path class="arrow" d="M320 457v29H168v28M320 486h152v28"/>
  <path class="arrow" d="m162 508 6 6 6-6m292 0 6 6 6-6"/>

  <rect x="24" y="534" width="288" height="463" rx="16" class="on"/>
  <rect x="328" y="534" width="288" height="463" rx="16" class="off"/>
  <text x="168" y="576" class="label center yes">autoSize: true</text>
  <text x="472" y="576" class="label center no">autoSize: false</text>
  <text x="168" y="607" class="body center">Redraws the chart</text>
  <text x="472" y="607" class="body center">Fits the last drawing</text>

  <g transform="translate(33 628) scale(.75)">
    <rect class="box" width="360" height="320"/>
    <rect class="plot" x="50" y="24" width="280" height="240"/>
    <path class="axis" d="M50 24V264H330"/>
    <rect class="bar" x="64" y="144" width="112" height="120"/>
    <rect class="bar" x="204" y="84" width="112" height="180"/>
    <g class="tick" text-anchor="end">
      <text x="43" y="34">100</text>
      <text x="43" y="154">50</text>
      <text x="43" y="274">0</text>
    </g>
    <g class="tick center">
      <text x="120" y="299">Q1</text>
      <text x="260" y="299">Q2</text>
    </g>
  </g>

  <rect x="337" y="628" width="270" height="240" class="box"/>
  <g transform="translate(337 676) scale(.45)">
    <rect width="600" height="320" fill="#fef9f3" stroke="#9d5b2d" stroke-width="4" stroke-dasharray="10 7"/>
    <rect class="plot" x="50" y="24" width="520" height="240"/>
    <path class="axis" d="M50 24V264H570"/>
    <rect class="bar" x="76" y="144" width="208" height="120"/>
    <rect class="bar" x="336" y="84" width="208" height="180"/>
    <g class="tick" text-anchor="end">
      <text x="43" y="34">100</text>
      <text x="43" y="154">50</text>
      <text x="43" y="274">0</text>
    </g>
    <g class="tick center">
      <text x="180" y="299">Q1</text>
      <text x="440" y="299">Q2</text>
    </g>
  </g>
  <text x="472" y="660" class="small center no">64 px space</text>
  <text x="472" y="851" class="small center no">64 px space</text>
  <g class="body center">
    <text x="168" y="910">CSS 360 × 320</text>
    <text x="168" y="942">viewBox 360 × 320</text>
    <text x="168" y="974" class="yes">Plot 280 × 240</text>
    <text x="472" y="910">CSS 360 × 320</text>
    <text x="472" y="942">viewBox 600 × 320</text>
    <text x="472" y="974" class="no">Drawn at 60% scale</text>
  </g>
</svg>
