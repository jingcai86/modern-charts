name-template: 'v$RESOLVED_VERSION'
tag-template: 'v$RESOLVED_VERSION'
categories:
  - title: '#### 💥 Breaking Changes'
    labels:
      - 'breaking'
      - 'major'
  - title: '#### 🚀 Features'
    labels:
      - 'feature'
      - 'enhancement'
  - title: '#### 🐛 Bug Fixes'
    labels:
      - 'bug'
      - 'fix'
  - title: '#### ♿ Accessibility (ARIA / a11y)'
    labels:
      - 'a11y'
      - 'accessibility'
  - title: '#### 🎨 UI, Theme & Docs'
    labels:
      - 'theme'
      - 'ui'
      - 'documentation'
      - 'docs'
  - title: '#### ⚙️ CI, Tooling & Dependencies'
    labels:
      - 'dependencies'
      - 'ci'
      - 'chore'
version-resolver:
  major:
    labels:
      - 'breaking'
      - 'major'
  minor:
    labels:
      - 'feature'
      - 'minor'
  patch:
    labels:
      - 'bug'
      - 'fix'
      - 'patch'
  default: patch
template: |
  ## modern-charts `v$RESOLVED_VERSION`

  ### 📦 Installation

  ```bash
  npm install modern-charts@$RESOLVED_VERSION
  ```

  ### 🔗 Links
  - **npm**: https://www.npmjs.com/package/modern-charts/v/$RESOLVED_VERSION
  - **Live Demo & Catalog**: https://jingcai86.github.io/modern-charts/

  ---

  ### 📋 What's Changed

  $CHANGES

  ---

  **Full Changelog**: https://github.com/jingcai86/modern-charts/compare/$PREVIOUS_TAG...v$RESOLVED_VERSION
