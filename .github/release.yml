changelog:
  exclude:
    labels:
      - ignore-for-release
    authors:
      - dependabot
      - dependabot[bot]
      - github-actions[bot]
  categories:
    - title: '💥 Breaking Changes'
      labels:
        - breaking
        - major
    - title: '🚀 Features'
      labels:
        - feature
        - enhancement
    - title: '🐛 Bug Fixes'
      labels:
        - bug
        - fix
    - title: '♿ Accessibility (ARIA / a11y)'
      labels:
        - a11y
        - accessibility
    - title: '🎨 UI, Theme & Docs'
      labels:
        - theme
        - ui
        - documentation
        - docs
    - title: '⚙️ CI, Tooling & Dependencies'
      labels:
        - dependencies
        - ci
        - chore
    - title: '📦 Other Changes'
      labels:
        - '*'
