name: Lighthouse CI Audit

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read
  pull-requests: write

jobs:
  lighthouse:
    name: Lighthouse Audit (Demo Site)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build demo site
        run: npm run build:examples

      - name: Run Lighthouse CI Audit
        id: lhci
        uses: treosh/lighthouse-ci-action@v12
        with:
          configPath: './lighthouserc.json'
          temporaryPublicStorage: true
          uploadArtifacts: true

      - name: Post Lighthouse Score Table PR Comment
        if: github.event_name == 'pull_request' && always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          LHCI_LINKS: ${{ steps.lhci.outputs.links }}
          LHCI_MANIFEST_PATH: ${{ steps.lhci.outputs.manifest }}
        run: node .github/scripts/post-lighthouse-comment.mjs
