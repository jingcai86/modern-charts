name: CI Pipeline

on:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: write
  pull-requests: write

jobs:
  test-and-build:
    name: Node ${{ matrix.node-version }} (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        node-version: [20, 22]
        os: [ubuntu-latest]

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Sync & verify AI Context schema
        run: node .github/scripts/sync-ai-context.mjs

      - name: Auto-commit synced AI Context schema to PR branch
        if: matrix.node-version == 22 && github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name == github.repository
        continue-on-error: true
        env:
          PR_HEAD_REF: ${{ github.head_ref }}
        run: |
          if [ -n "$(git status --porcelain apps/context/charts.schema.json)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add apps/context/charts.schema.json
            git commit -m "chore(context): auto-sync charts.schema.json defaultLayers [skip ci]"
            git push origin "HEAD:refs/heads/$PR_HEAD_REF"
          fi

      - name: Run Modern Web Guidance scan
        if: matrix.node-version == 22
        run: node .github/scripts/check-modern-web-guidance.mjs

      - name: TypeScript typecheck
        run: ./node_modules/.bin/tsc --noEmit

      - name: Test CI reporting
        if: matrix.node-version == 22
        run: node --test .github/scripts/*.test.mjs

      - name: Run unit & integration tests with coverage
        run: npm run test:coverage

      - name: Post Coverage, Web Guidance & AI Context PR Comment
        if: matrix.node-version == 22 && github.event_name == 'pull_request' && always()
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: node .github/scripts/post-ci-bot-comment.mjs

      - name: Upload coverage to Codecov
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        if: matrix.node-version == 22
        with:
          fail_ci_if_error: false
          token: ${{ secrets.CODECOV_TOKEN }}

      - name: Build library
        run: npm run build

      - name: Verify bundle size limits (PR)
        id: size-limit
        if: matrix.node-version == 22 && github.event_name == 'pull_request'
        run: npm run --silent size -- --json > "$RUNNER_TEMP/size-limit-current.json"

      - name: Measure bundle sizes on the PR base
        id: size-limit-base
        if: ${{ !cancelled() && (steps.size-limit.outcome == 'success' || steps.size-limit.outcome == 'failure') }}
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          base_dir="$RUNNER_TEMP/size-limit-base"
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          git worktree add --detach "$base_dir" "$BASE_SHA"
          cd "$base_dir"
          npm ci --ignore-scripts
          npm run build
          # A baseline that exceeds its budget can still be compared.
          npm run --silent size -- --json > "$RUNNER_TEMP/size-limit-base.json" || test -s "$RUNNER_TEMP/size-limit-base.json"

      - name: Publish bundle size report
        if: ${{ !cancelled() && steps.size-limit-base.outcome == 'success' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          SAME_REPO: ${{ github.event.pull_request.head.repo.full_name == github.repository }}
        run: |
          report="$RUNNER_TEMP/size-limit-report.md"
          jq -s '{base: .[0], current: .[1]}' \
            "$RUNNER_TEMP/size-limit-base.json" "$RUNNER_TEMP/size-limit-current.json" \
            | node .github/scripts/render-size-limit-report.mjs > "$report"
          cat "$report" >> "$GITHUB_STEP_SUMMARY"

          if [ "$SAME_REPO" = "true" ]; then
            comments="repos/$GITHUB_REPOSITORY/issues/$PR_NUMBER/comments"
            comment_id=$(gh api --paginate --slurp "$comments?per_page=100" | jq -r '
              [.[][] | select(.user.login == "github-actions[bot]" and (.body | startswith("## size-limit report 📦")))][0].id // empty
            ')
            if [ -n "$comment_id" ]; then
              gh api --method PATCH "repos/$GITHUB_REPOSITORY/issues/comments/$comment_id" --field "body=@$report" --silent
            else
              gh api --method POST "$comments" --field "body=@$report" --silent
            fi
          fi

      - name: Verify bundle size limit (Push)
        if: matrix.node-version == 22 && github.event_name != 'pull_request'
        run: npm run size

      - name: Build demo site
        run: npm run build:examples
