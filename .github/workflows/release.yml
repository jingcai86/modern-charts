name: Release & Publish to npm

on:
  push:
    branches:
      - main
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      dist_tag:
        description: 'npm dist-tag (auto detects alpha/beta/rc or latest)'
        required: false
        default: 'auto'
        type: choice
        options:
          - auto
          - latest
          - alpha
          - beta
      dry_run:
        description: 'Dry run (pack & verify without publishing to npm)'
        required: false
        default: false
        type: boolean

jobs:
  release-please:
    name: Manage Release PR & GitHub Release
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    outputs:
      release_created: ${{ steps.release.outputs.release_created }}
      tag_name: ${{ steps.release.outputs.tag_name }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Run Release Please
        id: release
        uses: googleapis/release-please-action@v4
        with:
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  publish:
    name: Build, Verify & Publish to npm
    needs: release-please
    if: >-
      !cancelled() &&
      needs.release-please.result != 'failure' &&
      (
        needs.release-please.outputs.release_created == 'true' ||
        github.event_name == 'workflow_dispatch' ||
        startsWith(github.ref, 'refs/tags/v')
      )
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: write
      id-token: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Ensure npm >= 11.5.1 for Trusted Publishing (OIDC)
        run: npm install -g npm@latest

      - name: Resolve version & dist-tag
        id: meta
        run: |
          PKG_VERSION=$(node -p "require('./package.json').version")
          TAG_NAME="v${PKG_VERSION}"

          if [[ "${GITHUB_REF_TYPE}" == "tag" && "${GITHUB_REF_NAME}" != "${TAG_NAME}" ]]; then
            echo "::error::Git tag (${GITHUB_REF_NAME}) does not match package.json version (${TAG_NAME})."
            exit 1
          fi

          INPUT_DIST_TAG="${{ inputs.dist_tag || 'auto' }}"
          if [[ "$INPUT_DIST_TAG" != "auto" ]]; then
            DIST_TAG="$INPUT_DIST_TAG"
          elif [[ "$PKG_VERSION" == *"-alpha"* ]]; then
            DIST_TAG="alpha"
          elif [[ "$PKG_VERSION" == *"-beta"* ]]; then
            DIST_TAG="beta"
          elif [[ "$PKG_VERSION" == *"-rc"* ]]; then
            DIST_TAG="next"
          else
            DIST_TAG="latest"
          fi

          IS_PRERELEASE="false"
          if [[ "$PKG_VERSION" == *"-"* ]]; then
            IS_PRERELEASE="true"
          fi

          echo "version=${PKG_VERSION}" >> "$GITHUB_OUTPUT"
          echo "tag=${TAG_NAME}" >> "$GITHUB_OUTPUT"
          echo "dist_tag=${DIST_TAG}" >> "$GITHUB_OUTPUT"
          echo "prerelease=${IS_PRERELEASE}" >> "$GITHUB_OUTPUT"

      - name: Install dependencies
        run: npm ci

      - name: Run test suite
        run: npm test

      - name: Build production bundle & TypeScript declarations
        run: npm run build

      - name: Verify build artifacts & bundle size
        run: |
          test -f dist/index.js
          test -f dist/index.d.ts
          test -f LICENSE
          npm run size

      - name: Pack distribution tarball
        id: pack
        run: |
          TARBALL=$(npm pack)
          echo "tarball=${TARBALL}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm registry (OIDC Trusted Publishing)
        if: ${{ inputs.dry_run != true }}
        run: |
          echo "Publishing modern-charts@${{ steps.meta.outputs.version }} with dist-tag '${{ steps.meta.outputs.dist_tag }}'..."
          npm publish --access public --provenance --tag "${{ steps.meta.outputs.dist_tag }}"

      - name: Dry-run npm publish check
        if: ${{ inputs.dry_run == true }}
        run: npm publish --dry-run --access public --tag "${{ steps.meta.outputs.dist_tag }}"

      - name: Upload packed tarball to Release Please GitHub Release
        if: ${{ inputs.dry_run != true && needs.release-please.outputs.release_created == 'true' }}
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release upload "${{ steps.meta.outputs.tag }}" "${{ steps.pack.outputs.tarball }}" --clobber

      - name: Generate standardized release notes (manual tag / dispatch fallback)
        if: ${{ inputs.dry_run != true && needs.release-please.outputs.release_created != 'true' }}
        env:
          RELEASE_VERSION: ${{ steps.meta.outputs.version }}
          RELEASE_TAG: ${{ steps.meta.outputs.tag }}
          RELEASE_DIST_TAG: ${{ steps.meta.outputs.dist_tag }}
        run: node .github/scripts/generate-release-notes.mjs release-notes.md

      - name: Create GitHub Release (manual tag / dispatch fallback)
        if: ${{ inputs.dry_run != true && needs.release-please.outputs.release_created != 'true' }}
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.meta.outputs.tag }}
          name: ${{ steps.meta.outputs.tag }}
          body_path: release-notes.md
          files: ${{ steps.pack.outputs.tarball }}
          generate_release_notes: false
          draft: false
          prerelease: ${{ steps.meta.outputs.prerelease == 'true' }}

  deploy-pages:
    name: Deploy Demo to GitHub Pages
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.release-please.outputs.release_created == 'true' && inputs.dry_run != true }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    concurrency:
      group: 'pages'
      cancel-in-progress: false
    steps:
      - name: Checkout released tag
        uses: actions/checkout@v4
        with:
          ref: ${{ needs.release-please.outputs.tag_name }}

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build library
        run: npm run build

      - name: Build demo site
        run: npm run build:apps

      - name: Setup Pages
        uses: actions/configure-pages@v6
        with:
          enablement: true

      - name: Upload artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: './dist-examples'

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
