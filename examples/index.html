<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>modern-charts v0.1.0-alpha.0 — Composable Web Component Charts</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <header class="site-header">
      <div class="header-left">
        <a href="#/" class="brand-link" id="brand-home-link" aria-label="Go to Overview Gallery">
          <div class="brand-group">
            <h1 class="brand-title">modern-charts</h1>
            <span class="version-pill">v0.1.0-alpha.0</span>
          </div>
          <p class="brand-subtitle">
            Composable Web Component Charting Library powered by D3 &amp; Pretext
          </p>
        </a>
      </div>

      <div class="global-controls">
        <a href="#/" class="nav-home-btn" id="nav-overview-btn">
          ⊞ All Chart Examples
        </a>

        <div class="control-group">
          <label for="global-theme-select">Theme:</label>
          <select id="global-theme-select">
            <option value="system" selected>System</option>
            <option value="dark">Dark Mode</option>
            <option value="light">Light Mode</option>
          </select>
        </div>
      </div>
    </header>

    <!-- Dynamic Router View: Overview Gallery (#/) or Dedicated Chart Playground (#/chart/:id) -->
    <main class="main-content" id="app-root"></main>

    <script type="module" src="./main.ts"></script>
  </body>
</html>
