sonar.sources=src,apps/studio,.github/scripts,.github/workflows,Dockerfile
sonar.tests=tests,.github/scripts
sonar.test.inclusions=tests/**,.github/scripts/*.test.mjs
sonar.javascript.lcov.reportPaths=coverage/lcov.info
# Vitest measures the library and Studio. Node CLI checks run separately.
sonar.coverage.exclusions=.github/scripts/**
sonar.qualitygate.wait=true
